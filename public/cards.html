<style>
    label {
        border-radius: 4px;
    }

    #sort_filter_buttons label {
        border: 1px solid white;
    }

    #sort_filter_buttons label:has(input.sortby2) {
        /* background: rgb(112, 112, 112) !important; */
        border-color: pink;
    }

    #sort_filter_buttons label.all-only {
        border-style: dashed;
    }

    .sortby-buttons label.all-only.hide,
    .all-only.hide {
        display: none;
    }


    .hide-badge .badge-defeated::before,
    .hide-badge .badge-new::before {
        display: none;
    }
    .not-implemented.badge-new::before {
        content: "";
    }
    .not-implemented img {
        filter: brightness(0.2);
    }
    .badge-new::before {
        content: "New!";
        color: gold;
        font-weight: bold;

        top: 0;
        right: 0;

        position: absolute;
        font-weight: bold;
        transform: rotate(45deg);
        transform-origin: 50% 100%;
        
        font-family: monospace;

        filter: drop-shadow(2px 4px 6px yellow);
        overflow: hidden;

        z-index: 2;

        --text-shadow-color: black;
        text-shadow: 2px 0 var(--text-shadow-color), -2px 0 var(--text-shadow-color), 0 2px var(--text-shadow-color), 0 -2px var(--text-shadow-color), 1px 1px var(--text-shadow-color), -1px -1px var(--text-shadow-color), 1px -1px var(--text-shadow-color), -1px 1px var(--text-shadow-color);
    }

    .badge-defeated::before {
        content: "defeated";
        color: black;
        font-weight: bold;
        position: absolute;
        transform: translate(-50%, 0%);
        transform-origin: 50% 50%;
        font-family: monospace;
        display: flex;
        z-index: 2;
        align-items: center;
        justify-content: center;
        top: 50%;
        left: 50%;
        background-color: rgba(255, 140, 0, 0.7);
        border-radius: 4px;
        border: 1px solid black;
        overflow: hidden;

        --text-shadow-color: black;
        /* text-shadow: 2px 0 var(--text-shadow-color), -2px 0 var(--text-shadow-color), 0 2px var(--text-shadow-color), 0 -2px var(--text-shadow-color), 1px 1px var(--text-shadow-color), -1px -1px var(--text-shadow-color), 1px -1px var(--text-shadow-color), -1px 1px var(--text-shadow-color); */
    }

    #peeked-cards,
    #hero_deck_images,
    #player_deck_images {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    #hero_deck_images,
    #player_deck_images {
        position: relative;
    }

    .sortby-buttons {
        display: flex;
        flex-wrap: wrap;
        /* gap: 5px; */
        align-items: center;
        column-gap: 5px;
        row-gap: 2px;
    }
    .sortby-buttons label {
        color: #000;
        display: inline-block;
        padding: .5rem;
        /* margin: .5rem; */
        font-family: monospace;
    }
    .sortby-buttons input[type="checkbox"] {
        display: none;
    }
    .sortby-buttons label:has(input:checked) {
        background-color: white;
        font-weight: bold;
    }
    #aspect_checkboxs label:has(input:checked){
        background-color: transparent;
    }
    #type_checkboxs label:has(input:checked) {
        background-color: wheat;
    }

    .sortby-buttons label:not(:has(input:checked)) {
        background-color: black !important;
        color: white;
        font-weight: lighter;
    }

</style>

<script type="module">
import { CardPreview } from '/public/js/module/card_preview.js';
// Instantiate the CardPreview class
const cardPreview = new CardPreview(window.cardStatistics.const_card_dict);
window.cardPreview = cardPreview
</script>

<script>
// @ts-check
// @ts-ignore: Object is possibly 'null'.
"strict"

cardStatistics = window.cardStatistics

function sanitizeString(str) {
    return str.replace(/[^a-z0-9]/gi, '_').toLowerCase();
}

/** @param {string} card_id */
function createCard(card_id, from_peek) {
    let img = document.createElement('img')
    let new_card_id = card_id
    let div = document.createElement('div')

    if( cardStatistics.const_card_dict[card_id].name == 'not implemented' ) {
        img.src = "no_image"
        div.classList.add('not-implemented')
    } else {
        window.cardImages.setImage(img, new_card_id)
    }

    div.classList.add('image-div')
    div.appendChild(img)
    div.setAttribute('data-card-id', card_id)

    if( !(card_id in cardStatistics.statistics_json) || cardStatistics.statistics_json[card_id].is_new ) {
        div.classList.add('badge-new')
    }
    if( card_id in cardStatistics.statistics_json && cardStatistics.statistics_json[card_id].defeated ) {
        div.classList.add('badge-defeated')
    }

    div.onclick = () => {
        window.cardPreview.previewCard(div, cardStatistics.statistics_json)
    }
    if( from_peek ) {
        div.oncontextmenu = (event) => {
            div.parentNode.removeChild(div)
            updatePeekedCardsString()
            return false
        }
        div.onmousedown = async (event) => {
            if (event.button == 1 || event.buttons == 4) {
                let new_div = createCard(card_id, true)
                div.parentNode.appendChild(new_div)
                updatePeekedCardsString()
                event.preventDefault();
            }
        }
    } else {
        div.oncontextmenu = (event) => {
            let new_div = createCard(card_id, true)
            document.querySelector('#peeked-cards').appendChild(new_div)
            updatePeekedCardsString()
            return false
        }
    }

    return div
}

/** @param {HTMLElement} e */
async function addCard(e, card_id) {
    let div = createCard(card_id, false)
    e.appendChild(div)
}






function isEmptyString(str) {
  return /^\s*$/.test(str);
}

function showAllCards(cards) {
    /** @type {HTMLElement}*/
    let e = document.querySelector(`#player_deck_images`)
    e.replaceChildren()
    
    for( let card of cards ) {
        addCard(e, card.card_id)
    }

    size = cards.filter(c => c.name == 'not implemented').length;
    if( size ) {
        document.querySelector('#rate_dev').innerHTML = `<span style='color: orange'>Unimplemented: ${size}</span>`
    } else {
        document.querySelector('#rate_dev').innerHTML = ""
    }
    // document.querySelector("#found_cards").innerHTML = `size: ${cards.length}`
}

function findNonNew(cards) {
    let non_new = 0
    for( let card of cards ) {
        let key = card.card_id
        if( key in cardStatistics.statistics_json && !cardStatistics.statistics_json[key].is_new ) {
            non_new += 1
        }
    }
    return non_new
}

function compareByProperties(properties, fallbackProperty) {
    return function(a, b) {
        for (let i = 0; i < properties.length; i++) {

            if( properties[i] == 'new' ) {
                let id_a = a.card_id
                let id_b = b.card_id
                let new_a = !(id_a in cardStatistics.statistics_json) || cardStatistics.statistics_json[id_a].is_new
                let new_b = !(id_b in cardStatistics.statistics_json) || cardStatistics.statistics_json[id_b].is_new
                if( new_a > new_b ) {
                    return -1
                }
                if( new_a < new_b ) {
                    return +1
                }
                return 0
            } else {
                let prop = properties[i];

                if( prop == 'name' || prop == 'type' ) {
                    if (a[prop] < b[prop]) {
                        return -1;
                    }
                    if (a[prop] > b[prop]) {
                        return +1;
                    }
                } else {
                    if (a[prop] < b[prop]) {
                        return +1;
                    }
                    if (a[prop] > b[prop]) {
                        return -1;
                    }
                }
            }
        }
        // If all properties are equal, sort by the fallback property
        if (a[fallbackProperty] < b[fallbackProperty]) {
            return -1;
        }
        if (a[fallbackProperty] > b[fallbackProperty]) {
            return 1;
        }
        return 0;
    };
}

function CleanType() {
    const checkboxes = document.querySelectorAll('.sortby-buttons input[type="checkbox"]');
    // Uncheck each checkbox
    checkboxes.forEach(checkbox => {
        checkbox.checked = false;
    });

    resort()
}

function resort() {
    sortBy(null)
}


function SelectAll() {
    keep_class = []
    document.querySelectorAll('#aspect_checkboxs input[type="checkbox"]').forEach((e) => {
        if( e.checked ) {
            keep_class.push(e.value)
        }
    })
    if( keep_class.length == 0 ) {
        document.querySelectorAll('#type_checkboxs input[type="checkbox"]').forEach((e) => {
            e.checked = true
        })
        document.querySelectorAll('#aspect_checkboxs input[type="checkbox"]').forEach((e) => {
            e.checked = true
        })
        document.querySelector('#show-duplicate').checked = true
        document.querySelector('#show-not-implemented').checked = true
        showOther(document.getElementById('filter_all'))
    }
    sortBy(null)
}

function sortBy(e) {
    names = []
    document.querySelectorAll('.sortby').forEach(e => {
        if( e.checked ) {
            names.push(e.value)
        }
    })

    if( names.length == 0 ) {
        names = 'card_id'
    }

    let cards = []
    cards.push(...cardStatistics.cards_list)

    document.querySelectorAll('.sortby2').forEach(e => {
        if( e.checked ) {
            cards = cards.filter(c => c[e.value] != null);
        }
    })

    for( let name of names ) {
        if( [ 'hp', 'thw', 'atk', 'sch', 'cost', 'boost', 'uses', 'victory', 'incite', 'restricted'].includes(name) ) {
            cards = cards.filter(c => c[name] != null);
        }
    }

    let name = document.querySelector('#find_name').value.toLowerCase()
    if( name ) {
        cards = cards.filter(c => c.name.toLowerCase().includes(name) || c.card_id == name);
    }

    let not_more_filter = name

    let trait = document.querySelector('#find_trait').value.toUpperCase()
    if( trait ) {
        cards = cards.filter(c => {
            // try {
            //     c.traits.includes(trait)
            // } catch (error) {
            //     let a = 1
            // }
            return c.traits.includes(trait)
        });
    }

    let ability_text = document.querySelector('#find_text').value
    if( ability_text ) {
        const regex = new RegExp(ability_text, 'i'); // 'i' for case-insensitive matching
        cards = cards.filter(c => {
            return regex.test(c.text);
        });
    }

    let package_name = document.querySelector('#package').value
    if( package_name ) {
        cards = cards.filter(c => c.package_name == package_name);
    }

    keep_class = ['']
    document.querySelectorAll('#aspect_checkboxs input[type="checkbox"]').forEach((e) => {
        if( e.checked ) {
            keep_class.push(e.value)
        }
    })
    
    keep_type = ['']
    document.querySelectorAll('#type_checkboxs input[type="checkbox"]').forEach((e) => {
        if( e.checked ) {
            keep_type.push(e.value)
        }
    })

    let show_duplicate = document.querySelector("#show-duplicate").checked
    if( !show_duplicate && !not_more_filter ) {
        cards = cards.filter(card => card.full_link_id == "");
    }
    let show_not_implemented = document.querySelector("#show-not-implemented").checked
    if( !show_not_implemented || package_name == '' ) {
        cards = cards.filter(card => card.name != "not implemented");
    }

    if( !not_more_filter ) {
        cards = cards.filter(card => keep_class.includes(card.class));
        cards = cards.filter(card => keep_type.includes(card.type));
    }
    cards.sort(compareByProperties(names, 'card_id'));

    showAllCards(cards, show_not_implemented)

    non_new = findNonNew(cards)
    if( cards.length > 0 ) {
        size = cards.filter(c => c.name != 'not implemented').length;
        rate = (non_new / size * 100).toFixed(1)
        document.querySelector('#rate_current').innerHTML = `${rate}% (${non_new}/${size})`
    } else {
        document.querySelector('#rate_current').innerHTML = ""
    }
}

function showOther(e) {
    var debugElements = document.querySelectorAll('.all-only');
    debugElements.forEach(function(element) {
        if( e.checked ) {
            element.classList.remove('hide');
        } else {
            element.classList.add('hide');
        }
    });
    resort()
}

</script>
<script src="/public/js/lib/sortable.js"></script>

<script>
    function onCardIdsUpdate() {
        const cardIds = document.querySelector("#card_ids").value.split(";").map(id => id.trim());
        const div = document.querySelector('#peeked-cards');
        div.replaceChildren();

        cardIds.forEach(cardId => {
            if( cardId ) {
                const newDiv = createCard(cardId, true);
                div.appendChild(newDiv);
            }
        });
        updatePeekedCardsString()
    }
    function updatePeekedCardsString() {
        let text = ""
        let count = 0
        document.querySelector("#peeked-cards").querySelectorAll('div').forEach(
            e => {
                text += e.getAttribute('data-card-id') + "; "
                count += 1
            }
        )
        document.querySelector("#card_ids").value = text
        document.querySelector("#peeked-cards-total-num").innerHTML = `size: ${count}`
    }
    document.addEventListener('DOMContentLoaded', function () {
        var sortable1 = Sortable.create(document.getElementById('peeked-cards'), {
            group: {
                name: 'shared',
                // put: false
            },
            animation: 150,
            ghostClass: 'sortable-ghost',
            onAdd: function(evt) {
                let card_id = evt.item.getAttribute('data-card-id');
                let newCard = createCard(card_id, true);
                evt.item.parentNode.replaceChild(newCard, evt.item);
                updatePeekedCardsString();
                let newCard2 = createCard(card_id);
                evt.clone.parentNode.replaceChild(newCard2, evt.clone);
            },
            onEnd: function (evt) {
                updatePeekedCardsString();
            }
        });

        var sortable2 = Sortable.create(document.getElementById('player_deck_images'), {
            group: {
                name: 'shared',
                pull: 'clone',
                put: false
            },
            // multiDrag: true, // Enable multi-drag
            // selectedClass: 'selected', // The class applied to the selected items
            // fallbackTolerance: 3, // So that we can select items on mobile
            sort: false,
            animation: 150,
            ghostClass: 'sortable-ghost'
        });
    });
</script>

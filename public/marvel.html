<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Marvel</title>
</head>

<body class="hide-auto-activate">
    <textarea name='data' id='selected-data' class='hide' rows="4" readonly>{}</textarea>

    <div id='camera'><div id='scene'>
        <div class="player-background player-0 hide-player"></div>
        <div class="player-background player-1 hide-player"></div>
        <div class="player-background player-2 hide-player"></div>
        <div class="player-background player-3 hide-player"></div>

        <div class='area area-schemes' id='area-schemes-side'></div>

        <div id='phase' class="hide"></div>

        <div class='area area-center' id='player-all-engaged-minions'></div>
        <div class='area area-center' id='player-all-allies'></div>
        <div class='area area-center' id='player-all-supports'></div>
        <div class='area area-center' id='player-all-area-hero'></div>
        
        <div class='deck player-0 player-deck'              id='player-0-player-deck'></div>
        <div class='deck player-0 additional-discard-pile'  id='player-0-additional-discard-pile'></div>
        <div class='deck player-0 additional-deck'          id='player-0-additional-deck'></div>
        <div class='deck player-0 player-discard-pile'      id='player-0-player-discard-pile'></div>

        <div class='deck player-1 player-deck'              id='player-1-player-deck'></div>
        <div class='deck player-1 additional-discard-pile'  id='player-1-additional-discard-pile'></div>
        <div class='deck player-1 additional-deck'          id='player-1-additional-deck'></div>
        <div class='deck player-1 player-discard-pile'      id='player-1-player-discard-pile'></div>

        <div class='deck player-2 player-deck'              id='player-2-player-deck'></div>
        <div class='deck player-2 additional-discard-pile'  id='player-2-additional-discard-pile'></div>
        <div class='deck player-2 additional-deck'          id='player-2-additional-deck'></div>
        <div class='deck player-2 player-discard-pile'      id='player-2-player-discard-pile'></div>

        <div class='deck player-3 player-deck'              id='player-3-player-deck'></div>
        <div class='deck player-3 additional-discard-pile'  id='player-3-additional-discard-pile'></div>
        <div class='deck player-3 additional-deck'          id='player-3-additional-deck'></div>
        <div class='deck player-3 player-discard-pile'      id='player-3-player-discard-pile'></div>

        <div class='area area-center'   id='player-all-hand-cards'></div>

        <div class='deck deck-top' id='victory-display' x="1250"></div>
        <div class='deck deck-top' id='removed-pool'    x="1400"></div> <!-- status card, insert -->
        <div class='deck deck-top' id='area-removed'    x="1400"></div>
        <div class='deck deck-top' id='nemesis-pool'    x="1550"></div>
        <div class='deck deck-top' id='area-advanced'   x="1700"></div>

        <div class='deck encounter-discard-pile' id='encounter-discard-pile-0'></div>
        <div class='deck encounter-discard-pile' id='encounter-discard-pile-1'></div>
        <div class='deck encounter-discard-pile' id='encounter-discard-pile-2'></div>
        <div class='deck encounter-discard-pile' id='encounter-discard-pile-3'></div>
        <div class='deck deck-top encounter-deck' id='encounter-deck-0'></div>
        <div class='deck deck-top encounter-deck' id='encounter-deck-1'></div>
        <div class='deck deck-top encounter-deck' id='encounter-deck-2'></div>
        <div class='deck deck-top encounter-deck' id='encounter-deck-3'></div>
        <div class='area area-schemes'  id='area-schemes-main'></div>
        <div class='area area-center'   id='area-villain'></div>
        <div class='deck' id='villain-schemes'></div>
        <div class='area' id='area-play'></div>
    </div><!-- scene --></div>

    <iframe id="weather-background" src=""></iframe>

    <div class='resources' id='player-all-resources'></div>

    <div id='option-buttons'></div>
    <!-- <button id='btn-hide-option-buttons' class="button" onclick="Button.doBtnHideOptions(this)">Hide<br/>Options</button> -->
    <div id='prompt-box-container' class="hide draggable">
        <div id='prompt-box-close'>&times;</div>
        <div id='prompt-box-lock' class="locked"><i class="fa fa-lock" aria-hidden="true"></i></div>
        <div id='prompt-text'></div>
    </div>
    <button id='btn-end' class="button" onclick="Button.doBtnCancel()" disabled></button>
    <button id='btn-ok' class="button ok" onclick="Button.doBtnOk()" disabled>OK</button>

    <div id="right-side-bar" class="side-bar">
        <div id="right-side-bar-handle">Settings</div>
        <div id="interaction-speed-control">
            <label for="anime-time">
                <span>Card speed</span>
                <output id="anime-speed-value" for="anime-time">1&times;</output>
            </label>
            <input type="range" min=".25" max="2" value="1" step=".25" class="slider" id="anime-time">
            <div class="speed-scale" aria-hidden="true">
                <span>Slower</span>
                <span>Faster</span>
            </div>
        </div>
        <input type="range" min="100" max="1500" value="600" class="slider hide" id="delay-range">
        <input type="range" min="-5" max="5" value=".5" step="0.1" class="slider hide" id="hand-card-margin">
        <input type="range" min="-5" max="5" value=".5" step="0.1" class="slider hide" id="hand-card-margin-bottom">
        <input type="range" min="-100" max="100" value="0" class="slider hide" id="hand-card-total-deg">
    </div>

    <div id="image-preview-div-left" class="image-preview-div hide display-none">
        <div class='image-preview'>
            <div class="image-preview-text"></div>
        </div>
        <div class='image-preview-name'></div>
        <div class="image-preview-debug-text debug-only"></div>
    </div>

    <div id="image-preview-div-right" class="image-preview-div hide display-none">
        <div class='image-preview'>
            <div class="image-preview-text"></div>
        </div>
        <div class='image-preview-name'></div>
        <div class="image-preview-debug-text debug-only"></div>
    </div>

    <div id="image-preview-div-center" class="image-preview-div hide display-none">
        <div class='image-preview'>
            <div class="image-preview-text"></div>
        </div>
        <div class='image-preview-name'></div>
        <div class="image-preview-debug-text debug-only"></div>
    </div>

    <div id="history" class="hide">
        <div id='history-text'></div>
        <div id="contextMenu">
            <button id="view_in_mdb" onclick="HistoryLog.gotoMDB(this)">View on Marvelcdb</button>
            <!-- <button id="view_in_mdb" class="debug-only hide" onclick="HistoryLog.editCard(this)">Edit</button> -->
        </div>
        <div id="ex-buttons">
            <div style="display: flex;" id="ex-buttons-1"> </div>
            <div style="display: flex;" id="ex-buttons-2"> </div>
            <div style="display: flex;" id="ex-buttons-3"> </div>
            <div style="display: flex;" id="ex-buttons-4"> </div>

            <div style="display: flex;">
                <button class="button" onclick="Button.gotoStep()">Goto</button>
                <output class="slider"></output>
                <input type="range" min="1" max="1" value="0" step="1" class="slider" id="goto-id" oninput="this.previousElementSibling.value = this.value" style="max-width: 500px;"> <output id="current-round"></output>
            </div>

        </div>
    </div>

    <div id="left-side-bar" class="side-bar"> </div>

    <div class='overlay' style="color: #1A1A1A;" id='version'></div>
    <div id="overlay-icon">
        <div id='replay-icon'><i class="fa fa-play" aria-hidden="true"></i></div>
        <div class='hide' id='skipping-icon'><i class="fa fa-fast-forward" aria-hidden="true"></i> </div>
        <div id='pause-icon'><i class="fa fa-pause" aria-hidden="true"></i></div>
    </div>

    <div id="lost-connect" class="lost-connect hide">
        <p id="wait-connect">Reconnect in <span id="retry-timer">1</span> seconds. <a id="reconnect-link">Reconnect Now</a></p>
        <p id="connecting">Connecting...</p>
        <p id="manual-connect"><a id="reconnect-link2">Reconnect Now</a></p>
    </div>

    <div id='top-bar' style="display: none;">
        <span id="turn-id"></span>
    </div>

    <div class="notifications"></div>

    <script src="/public/js/lib/vanilla-tilt.js"></script>
    <script src="/public/js/lib/click-effect.js"></script>
    <script src="/public/js/marvel/marvel.js?v=1.3.1r" type="module"></script>

    <audio id="play-bgm" src="" preload="auto" controls="none" style="display: none;" loop></audio>

    <div id="achievement-bar" class="remove"></div>

    <div id="message-overlay">
        <div id="message-text" class="message-text"></div>
    </div>

    <div id="game-over-box-container">
        <div id="game-over-box">
            <div id="game-over-message">
                <div id="game-over-text" class="message-text"></div>
                <div id="game-over-text-2"></div>
                <div id="game-over-buttons"></div>
                <div id="session-statistics-container">
                    <table id="session-statistics"></table>
                </div>
            </div>
            <div id='game-over-close' onclick="document.getElementById('game-over-box-container').classList.toggle('minimize')"><i class="fa fa-bar-chart" aria-hidden="true"></i></div>
        </div>
    </div>


    <div id='debug-window' class="hide-background debug-only hide"></div>

    <script src="/public/js/marvel/draggable.js?v=1.3.1r" type="module"></script>
    <!-- <canvas id="canvas"></canvas> -->
    <!-- <script src="/public/js/marvel/canvas.js"></script> -->

    <div id="player-mouse-0"></div>
    <div id="player-mouse-1"></div>
    <div id="player-mouse-2"></div>
    <div id="player-mouse-3"></div>
</body>
</html>
